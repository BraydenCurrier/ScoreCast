
name: Build ScoreCast Raspberry Pi Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-image:
    name: Build Pi 4 Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout ScoreCast
        uses: actions/checkout@v4

      - name: Prepare ScoreCast image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$GITHUB_SHA"
          fi

          echo "Building ScoreCast version: $VERSION"

          FILES_DIR="image/stage-scorecast/00-install/files"
          mkdir -p "$FILES_DIR"

          printf '%s\n' "$VERSION" \
            > "$FILES_DIR/scorecast-image-version"

          cp scripts/install.sh \
            "$FILES_DIR/scorecast-image-install.sh"

          chmod +x \
            image/stage-scorecast/prerun.sh \
            image/stage-scorecast/00-install/00-run.sh \
            image/stage-scorecast/00-install/00-run-chroot.sh

          bash -n scripts/install.sh
          bash -n image/stage-scorecast/prerun.sh
          bash -n image/stage-scorecast/00-install/00-run.sh
          bash -n image/stage-scorecast/00-install/00-run-chroot.sh

      - name: Build Raspberry Pi OS image
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: ScoreCast-${{ github.run_number }}-pi4
          pi-gen-version: arm64
          release: trixie
          stage-list: stage0 stage1 stage2 ./image/stage-scorecast
          export-last-stage-only: true
          compression: xz
          hostname: scorecast
          username: gameline
          password: 1inepr0
          disable-first-boot-user-rename: 0
          enable-ssh: 1
          enable-cloud-init: 0
          increase-runner-disk-size: false
          verbose-output: true

      - name: Upload image for testing
        uses: actions/upload-artifact@v4
        with:
          name: ScoreCast-Pi4-Image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_PATH: ${{ steps.build.outputs.image-path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IMAGE_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$IMAGE_PATH" \
              --title "ScoreCast $GITHUB_REF_NAME" \
              --generate-notes
          fi
