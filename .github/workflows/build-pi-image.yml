
name: Build ScoreCast Raspberry Pi Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-image:
    name: Build Pi 4 Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout ScoreCast
        uses: actions/checkout@v4

      - name: Build Raspberry Pi OS image
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: ScoreCast-${{ github.ref_name }}-pi4
          pi-gen-version: arm64
          release: trixie
          stage-list: stage0 stage1 stage2 ./image/stage-scorecast
          compression: xz
          hostname: scorecast
          enable-ssh: 0
          password: ''
          enable-cloud-init: 1
          increase-runner-disk-size: true

      - name: Upload image for testing
        uses: actions/upload-artifact@v4
        with:
          name: ScoreCast-Pi4-Image
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_PATH: ${{ steps.build.outputs.image-path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$IMAGE_PATH" \
            --title "ScoreCast $GITHUB_REF_NAME" \
            --generate-notes
